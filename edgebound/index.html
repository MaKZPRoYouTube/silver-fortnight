<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d1d" />
    <title>EDGEBOUND</title>
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="EDGEBOUND game">
      <canvas id="game" aria-label="Tap to jump"></canvas>
      
      <!-- HUD -->
      <section class="hud" aria-live="polite">
        <div class="brand">EDGEBOUND <span>///</span></div>
        <div class="hud-stats">
          <span id="streak">СТРИК ×0</span>
          <strong id="score">0000</strong>
        </div>
        <div class="wind-meter">
          <span class="wind-label">ВЕТЕР</span>
          <i id="wind-arrow">→</i>
          <div class="wind-track"><b id="wind-fill"></b></div>
        </div>
        <div class="hud-controls">
          <button id="sound-btn" class="icon-btn" aria-label="Звук">🔊</button>
          <button id="shop-btn" class="icon-btn" aria-label="Магазин">🛍️</button>
        </div>
        <p id="objective">ЗАГРУЗКА...</p>
      </section>

      <!-- Панель старта -->
      <section id="start-panel" class="panel visible">
        <p class="eyebrow">SECTOR 01 / ONBOARDING</p>
        <h1>НАЙДИ СВОЮ<br /><em>ГРАНЬ.</em></h1>
        <p>Одно касание. Один прыжок.<br />Попади в ядро для <b>ИДЕАЛЬНО.</b></p>
        <button id="start-button">В БОЙ <span>↗</span></button>
        <small>ПРОБЕЛ / КЛИК / КАСАНИЕ</small>
      </section>

      <!-- Панель результата -->
      <section id="result-panel" class="panel">
        <p id="result-kicker" class="eyebrow">ПРИЗЕМЛЕНИЕ ПОДТВЕРЖДЕНО</p>
        <h2 id="result-title">ИДЕАЛЬНО!</h2>
        <p id="result-reward">+200 МОНЕТ</p>
        <button id="retry-button">СЛЕДУЮЩИЙ СЕКТОР <span>↗</span></button>
      </section>

      <!-- Модальное окно магазина скинов -->
      <section id="shop-panel" class="panel">
        <div class="shop-header">
          <h2>МАГАЗИН СКИНОВ</h2>
          <p id="shop-coins-display">💰 0 МОНЕТ</p>
        </div>
        <div id="skins-grid" class="skins-grid">
          <!-- Карточки скинов создаются динамически -->
        </div>
        <button id="shop-close-btn">ЗАКРЫТЬ</button>
      </section>

      <div id="feedback" class="feedback" aria-live="assertive"></div>
      <p class="tap-hint">НАЖМИТЕ ДЛЯ ПРЫЖКА</p>
    </main>
    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
