<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d1d" />
    <title>EDGEBOUND</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="EDGEBOUND game">
      <canvas id="game" aria-label="Tap to jump"></canvas>
      <section class="hud" aria-live="polite">
        <div class="brand">EDGEBOUND <span>///</span></div>
        <div class="hud-stats"><span id="streak">STREAK ×0</span><strong id="score">0000</strong></div>
        <div class="wind-meter"><span class="wind-label">WIND</span><i id="wind-arrow">→</i><div class="wind-track"><b id="wind-fill"></b></div></div>
        <p id="objective">TIME THE MOVING PLATFORM</p>
      </section>
      <section id="start-panel" class="panel visible">
        <p class="eyebrow">SECTOR 01 / WIND TEST</p>
        <h1>FIND THE<br /><em>EDGE.</em></h1>
        <p>One tap. One jump.<br />Land in the core for a <b>PERFECT.</b></p>
        <button id="start-button">TAP TO DROP IN <span>↗</span></button>
        <small>SPACE / CLICK / TAP</small>
      </section>
      <section id="result-panel" class="panel">
        <p id="result-kicker" class="eyebrow">LANDING CONFIRMED</p>
        <h2 id="result-title">PERFECT!</h2>
        <p id="result-reward">+200 COINS</p>
        <button id="retry-button">RUN IT BACK <span>↻</span></button>
      </section>
      <div id="feedback" class="feedback" aria-live="assertive"></div>
      <p class="tap-hint">TAP ANYWHERE TO JUMP</p>
    </main>
    <script type="module" src="./dist/game.js"></script>
  </body>
</html>
